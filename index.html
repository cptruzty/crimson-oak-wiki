<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crimson Oak</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0b0b; }
    body { min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    .entrance { display: block; width: min(92vw, 900px); line-height: 0; }
    .entrance img { display: block; width: 100%; height: auto; transition: transform .35s ease, filter .35s ease; }
    .entrance:hover img, .entrance:focus-visible img { transform: scale(1.015); filter: brightness(1.06); }
  </style>
</head>
<body>
  <!-- Crimson Oak entrance page -->
  <a class="entrance" href="#" aria-label="Enter Crimson Oak">
    <img src="Crimson_Oak.png" alt="Crimson Oak">
  </a>
</body>
</html>
