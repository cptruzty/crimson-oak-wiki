<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crimson Oak Academy</title>
  <style>
    :root{--paper:#f2ead8;--ink:#243126;--green:#1f5a38;--crimson:#8f2926;--gold:#b88a35;}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    main{width:min(94vw,1120px);margin:0 auto;padding:34px 20px 54px;text-align:center}
    .hero{display:block;width:100%;height:auto;margin:0 auto 28px}
    h1{margin:0 0 14px;color:var(--green);font-size:clamp(2rem,5vw,3.4rem);font-weight:500;letter-spacing:.045em}
    .intro{max-width:820px;margin:0 auto 34px;font-size:clamp(1.05rem,2vw,1.18rem);line-height:1.7}
    .lessons{max-width:850px;margin:0 auto;border-top:2px solid var(--gold);padding-top:26px}
    .lesson{display:block;padding:24px 26px;background:rgba(255,255,255,.22);border-bottom:1px solid #c9b78e;text-decoration:none;color:var(--ink);text-align:left}
    .lesson:hover,.lesson:focus-visible{background:#fff8e8}
    .number{color:var(--gold);font:700 .8rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
    .lesson h2{margin:7px 0 8px;color:var(--crimson);font-size:1.55rem;font-weight:500}
    .lesson p{margin:0;line-height:1.55}
    .back{display:block;width:fit-content;margin:34px auto 0;color:#756a57;text-decoration:none;font:600 .85rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .back:hover,.back:focus-visible{color:var(--crimson)}
  </style>
</head>
<body>
  <main>
    <img class="hero" src="academy.png" alt="Crimson Oak Academy">
    <h1>Welcome to Crimson Oak Academy</h1>
    <p class="intro">The Academy is here to help every member grow. Start with the lessons below and build your knowledge, strength and contribution to the alliance one step at a time.</p>
    <section class="lessons">
      <a class="lesson" href="academy-lesson-1.html">
        <span class="number">Lesson 1</span>
        <h2>The First Lesson</h2>
        <p>The easiest way to grow is to participate.</p>
      </a>
    </section>
    <a class="back" href="wiki.html">&larr; Wiki Lobby</a>
  </main>
</body>
</html>
